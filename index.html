<!DOCTYPE html>
    <html lang="en">
    <head>
        <title>Hangout.exe</title>
        <meta name="author" content="Balraj Bains: hello@blraj.com">
        <meta name="description" content="Events in London www.instagram.com/hangout.london">
        <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
        <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js'></script>
        <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js'></script>
        <script src="basic.js"></script>
        <link rel="stylesheet" href="style.css">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Sixtyfour+Convergence&display=swap');
        </style>
    </head>
    <body>
        
        <!-- <a-scene vr-mode-ui='enabled: false' 
        arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false' 
        renderer='antialias: true; alpha: true'
        gltf-model="dracoDecoderPath: 3D/dracoDecoderPath;"
        reflection="directionalLight: a-light[type=directional]"
        ar-hit-test="target: #objects;"
        renderer="colorManagement: true; exposure: 1; toneMapping: ACESFilmic"
        shadow="type: pcfsoft"
        xr-mode-ui="XRMode: xr"
        renderer="logarithmicDepthBuffer: true" 
        embedded
        > -->
        <a-scene
        loading-screen="enabled: false"
        gltf-model="dracoDecoderPath: 3D/dracoDecoderPath;"
        renderer="colorManagement: true; exposure: 1; toneMapping: ACESFilmic; 
        logarithmicDepthBuffer: true; antialias: true; sortObjects: true;"
        embedded arjs
        >
            <!-- <a-camera gps-new-camera='gpsMinDistance: 15'></a-camera> -->
            <!-- use 15km for London -->
            <!-- <a-entity light="type: ambient; color: #BBB"></a-entity> -->
            <!-- <a-box gps-new-entity-place="latitude: 51.407765929020044; longitude: 0.42928049758817066"
            position="0 0 0" rotation="0 45 45" scale="2 2 2"
            animation="property: object3D.position.y; to: 10; dir: alternate; dur: 2000; loop: true"></a-box> -->


            <a-assets>
                <a-asset-item id="hand" src="3D/hand_still.glb"></a-asset-item> 
                <a-cubemap id="hdri">
                    <img src="images/hdri_cube/posx.png">
                    <img src="images/hdri_cube/negx.png">
                    <img src="images/hdri_cube/posy.png">
                    <img src="images/hdri_cube/negy.png">
                    <img src="images/hdri_cube/posz.png">
                    <img src="images/hdri_cube/negz.png">
                </a-cubemap>
            </a-assets>
            <!-- gps-new-entity-place="latitude: 51.4086; longitude: 0.4293"  -->
            <!-- animation="property: object3D.position.y; to: 0.1; dir: alternate; dur: 2000; loop: true" -->
            <a-entity gltf-model="#hand"
                visible="true"
                scale="0.01 0.01 0.01"
                position="0 0 -7.5"
                cube-env-map="path: images/hdri_cube/; extension: png;"
                
                animation="property: rotation; dur: 10000; easing: linear; loop: true; to: 0 360 0"
                
            >
            </a-entity>

            
            
            <!-- <a-assets>
                animation="property: visible; to: true; startEvents: deviceorientationpermissiongranted"
                <a-asset-item id="crow" src="3D/crow_animated.glb"></a-asset-item>
            </a-assets> -->

              
        </a-scene>
    </body>
</html>
